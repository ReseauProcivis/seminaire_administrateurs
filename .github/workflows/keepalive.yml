# Maintient le projet Supabase actif (le plan gratuit met en pause un projet
# sans requête pendant une semaine). Une requête de lecture par semaine suffit.
# Renseigner les secrets SUPABASE_URL et SUPABASE_ANON_KEY dans Settings > Secrets du dépôt.
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 6 * * 1,4"   # lundi et jeudi à 06h17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête de lecture
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Secrets absents, rien à faire"; exit 0; fi
          curl -sf "$SUPABASE_URL/rest/v1/reponses?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
          echo "Ping OK"
